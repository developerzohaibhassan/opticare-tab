plugins {
    id 'com.android.application'
}
android {
    namespace 'com.opticare.oldtab'
    compileSdk 34
    defaultConfig {
        applicationId "com.opticare.oldtab"
        minSdk 16
        targetSdk 33
        versionCode 2
        versionName "1.1"
    }
    signingConfigs {
        debug {
            storeFile file('opticare.keystore')
            storePassword 'opticare123'
            keyAlias 'opticare'
            keyPassword 'opticare123'
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
